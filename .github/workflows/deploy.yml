# Flusso di lavoro per il rilascio su GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ['main']

# Permessi per consentire a GitHub Actions di rilasciare sulle Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette l'esecuzione di un solo deployment alla volta
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Carica la cartella di output di Vite (dist)
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
